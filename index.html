<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🍓</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:Georgia,serif;
  background:linear-gradient(135deg,#ffd9e2,#fff6f8);
  color:#6e3040;
}
.screen{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:24px; transition:opacity .7s,transform .7s;
}
.hidden{opacity:0;pointer-events:none;transform:scale(1.04)}
.card{
  width:min(92vw,440px); padding:34px 26px; text-align:center;
  background:rgba(255,255,255,.94); border-radius:32px;
  box-shadow:0 18px 55px rgba(130,35,65,.18);
}
.envelope{font-size:90px;animation:float 2s ease-in-out infinite}
h1{color:#cf3157;font-size:34px;margin:12px 0 10px}
p{font-size:18px;line-height:1.6;margin:10px 0 20px}
button{
  border:0;padding:14px 25px;border-radius:999px;
  background:#df3d62;color:white;font-size:16px;cursor:pointer;
  box-shadow:0 7px 18px rgba(223,61,98,.25);
}
button:active{transform:scale(.97)}
.photo{
  width:220px;height:220px;object-fit:cover;border-radius:28px;
  border:7px solid white;box-shadow:0 10px 30px rgba(0,0,0,.18);
}
.berries{font-size:34px;letter-spacing:8px}
.small{font-size:15px;opacity:.8}
#finalMessage{font-weight:bold;color:#cf3157;font-size:20px;margin-top:18px;display:none}
.float{position:absolute;bottom:-50px;animation:rise linear forwards;z-index:0}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
</style>
</head>

    <p>It's very important. 🍓</p>
    <button onclick="nextScreen()">Open my little message 💕</button>
  </div>
</div>

    <p>
      You are the absolute sweetest part of my life, and I am so glad I got to pick you. 🍓
    </p>

</div>

<script>
function nextScreen(){
  document.getElementById('one').classList.add('hidden');
  document.getElementById('two').classList.remove('hidden');
  burst();
}
function reveal(){
  document.getElementById('finalMessage').style.display='block';
  burst(28);
}
function burst(n=14){
  for(let i=0;i<n;i++){
    const x=document.createElement('div');
    x.className='float';
    x.textContent=Math.random()>.35?'🍓':'❤️';
    x.style.left=Math.random()*100+'vw';
    x.style.fontSize=(20+Math.random()*24)+'px';
    x.style.animationDuration=(3+Math.random()*3)+'s';
    document.body.appendChild(x);
    setTimeout(()=>x.remove(),6500);
  }
}
</script>
