<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            overflow: hidden;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            z-index: 2;
        }
        h1 { color: #d63384; margin-bottom: 20px; }
        p { color: #4a4a4a; margin-bottom: 30px; line-height: 1.5; }
        .btns { display: flex; gap: 10px; justify-content: center; }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .b1 { background: #ff4d6d; }
        .b2 { background: #ff758f; }
        .heart {
            position: absolute;
            animation: float 4s linear forwards;
            z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <div id="box" class="card">
        <h1>Hi baby 💕</h1>
        <p>you mean more to me than words can say. I’m very excited to spend our first valentine together. Will you pleaseeee be my valentine</p>
        <div class="btns">
            <button class="b1" onclick="go()">Yes 😍</button>
            <button class="b2" onclick="go()">Yes obviously 🙄❤️</button>
        </div>
    </div>

    <script>
        function go() {
            document.getElementById('music').play();
            document.getElementById('box').innerHTML = `
                <h1 style="font-size: 2.5rem;">YAY!!! 💖🎉</h1>
                <p>Happy Valentine’s Day, my love ❤️ I can’t wait to spend it with you.</p>
            `;
            setInterval(() => {
                const h = document.createElement('div');
                h.className = 'heart';
                h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.fontSize = (Math.random() * 20 + 10) + 'px';
                h.style.duration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>
